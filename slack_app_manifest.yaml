# Slack API > Your Apps > Create New App > From an app manifest 에 붙여넣기
display_information:
  name: 주간 날씨
  description: 매주 월요일 아침, 이번 주 날씨 요약과 기상청 일기도를 전해드립니다.
  background_color: "#1d4e89"
features:
  bot_user:
    display_name: 주간 날씨
    # display_name 없이 스코프만 넣으면 설치 시
    # '설치할 봇 사용자가 없습니다' 오류가 난다.
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write        # 메시지 게시
      - files:write       # 일기도 이미지 업로드
      # - commands        # /이번주날씨 같은 슬래시 커맨드를 붙일 때만 추가 (Bolt 필요)
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false   # 예약 게시만 하는 봇은 상시 연결이 필요 없다
  token_rotation_enabled: false
