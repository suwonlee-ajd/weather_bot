name: weekly-weather

# 손으로 돌리는 용도만 — 주간 게시는 서버의 weather-weekly.timer(월 07:50 KST)가 맡음.
# schedule: 을 넣으려면 서버 타이머부터 끔 — 둘 다 켜면 매주 두 번 올라감(deploy/DEPLOY.md §4).
#   systemctl --user disable --now weather-weekly.timer
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "슬랙 전송 없이 결과만 확인 (이미지는 아티팩트로 첨부)"
        type: boolean
        default: true

concurrency:
  group: weekly-weather
  cancel-in-progress: false

env:
  # 러너는 UTC — 로그 파일명·자정 회전을 KST 로 맞춤
  TZ: Asia/Seoul

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # 두 extra 를 다 설치 — 고른 WRITER 의 패키지가 없으면 규칙 기반으로 떨어짐
      - run: uv sync --frozen --extra claude --extra gemini

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      # fonts-noto-cjk 필수 — 러너에 한글 글꼴이 없어 카드 글자가 □□□ 로 나옴
      - name: Install Chromium + Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          uv run python -m playwright install --with-deps chromium

      - name: Post weekly weather
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 비우면 전국
          REGION: ${{ vars.REGION }}
          AREA_LABEL: ${{ vars.AREA_LABEL }}
          WRITER: ${{ vars.WRITER }}
          CHART_PRODUCT: ${{ vars.CHART_PRODUCT }}
          POST_AT: "08:00"
        run: uv run python -m src.weekly ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload rendered images (dry-run 확인용)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-weather-images
          path: data/
          if-no-files-found: warn
