[project]
name = "weather-bot"
version = "0.3.0"
description = "기상청 공개 페이지를 긁어 주간 날씨를 슬랙에 올리고, 멘션에 답하는 봇"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    # 실수로 `uv publish` 해도 PyPI 가 거부함
    "Private :: Do Not Upload",
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "slack_sdk>=3.33",
    "slack_bolt>=1.30",
    "playwright>=1.49",  # 설치 후 `python -m playwright install chromium` 도 필요
    "loguru>=0.7",
    "pypdf>=5.0",  # 단풍·벚꽃 예상일 PDF(웨더아이) 읽기
]

[project.optional-dependencies]
# WRITER=claude · gemini 일 때만 필요
claude = ["anthropic>=1.0"]
gemini = ["google-genai>=2.28"]

[project.scripts]
weather-post = "src.weekly.post:main"
weather-mention = "src.mention.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["ruff>=0.15,<0.16"]

[tool.ruff.lint]
extend-select = ["I"]   # import 정렬
